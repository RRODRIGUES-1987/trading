<script>

const esc=v=>String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=s=>{ s=String(s==null?'':s).trim(); if(!s) return 0; s=s.replace(/[^\d,.-]/g,''); if(s.indexOf(',')>=0) s=s.replace(/\./g,'').replace(',','.'); return parseFloat(s)||0; };
const fmtIn=v=>(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});

function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'),2200); }

const EST0=[['APOLO','CINZA','4L','024','MK'],['APOLO','CINZA','4L','025','MK'],['APOLO','PRETO','4L','021','Exposição'],['APOLO ULTRA','AZUL','4L','058','MK'],['APOLO ULTRA','AZUL','4L','059','MK'],['APOLO ULTRA','BRANCO','4L','046','Exposição'],['APOLO ULTRA','CINZA','4L','052','MK'],['APOLO ULTRA','PRATA','4L','056','MK'],['APOLO ULTRA','PRATA','4L','057','MK'],['FALCON','AZUL','4+2L','019','MK'],['FALCON','CINZA','4+2L','017','MK'],['FALCON','PRATA','2+2L','041','Exposição']]
  .map(r=>({id:r[0]+'-'+r[3],modelo:r[0],cor:r[1],lugares:r[2],chassi:r[3],local:r[4],status:'disponivel',pedido:null}));
// histórico do chassi (rastreabilidade): cada movimento grava um evento

const MODS={
  home:{nome:'Início',itens:[['home','Início']]},
  cad:{nome:'Cadastros',itens:[['modelos','Modelos e preços'],['itens','Peças e acessórios'],['clientes','Clientes'],['fornecedores','Fornecedores'],['transportadores','Transportadores'],['vendedores','Vendedores e comissionados'],['locais','Locais de estoque'],['empresa','Empresa e dados']]},

function renderNav(){

}
function render(){
  renderNav(); const M=MODS[mod], it=M.itens.find(i=>i[0]===tela)||M.itens[0]; tela=it[0];
  $('migalha').innerHTML=mod==='home'?'<b>Início</b>':`${M.nome} / <b>${it[1]}</b>`; $('acoes').innerHTML='';

function emBreve(nome){ const planos={entregas:['agenda de entregas por venda','transportador, data e janela','checklist de entrega técnica, foto e termo assinado','a data da entrega inicia a garantia'],receber:['títulos gerados pela ficha de venda (entrada, parcelas, cartão)','baixa e conciliação','vencidos e a vencer'],pagar:['comissões e fretes gerados pela venda','compras de carrinhos (recebimento)','baixa e vencimentos'],fluxo:['entradas e saídas por data','saldo projetado'],fichas:['a ficha de venda integrada, com os chassis do estoque','relatórios interno, financeiro e do cliente'],painel:['vendas por mês, modelo e vendedor','margem por venda'],garantias:['prazo por modelo (veículo e bateria)','chamados com defeito, peças e custo'],rastreio:['linha do tempo de cada chassi, do recebimento ao último chamado']};
  return `<div class="card em-breve"><h1>${esc(nome)}</h1><p class="sub">Próxima etapa da construção.</p>${planos[tela]?'<b>O que vai ter:</b><ul>'+planos[tela].map(x=>'<li>'+x+'</li>').join('')+'</ul>':''}</div>`; }

};
function telaCad(k){ const C=CAD[k], L=db.lista(k), cols=C.campos.filter(c=>c[3]!=='textarea').slice(0,5);
  $('acoes').innerHTML=`<button class="btn btn-p" onclick="formCad('${k}')">+ Novo ${C.um}</button>`;

function campoHtml(c,v){ const [k,l,cl,tp,ops]=c; v=v==null?'':v;
  if(tp==='textarea') return `<div class="campo ${cl}"><label for="f_${k}">${l}</label><textarea id="f_${k}" rows="3">${esc(v)}</textarea></div>`;

function fichaChassi(id){ const E=db.estoque(), c=E.find(x=>x.id===id); if(!c) return; const fi=db.fichas().find(f=>(f.carros||[]).some(x=>x.id===c.id)), m=db.modelos().find(x=>x.nome.toUpperCase()===(c.modelo+' '+c.lugares).toUpperCase())||{};

function salvarReceb(){ const nf=$('f_nf').value.trim(); if(!nf){ toast('Informe a NF de entrada'); return; }
  const pecas=[...document.querySelectorAll('#recPecas .itens-rec')].map(l=>({item:l.children[0].value,qtd:parseInt(l.children[1].value||'0',10),custo:num(l.children[2].value),local:l.children[3].value})).filter(x=>x.qtd>0);

  if(sg<0&&saldoItem(id,loc)<qt){ toast('Saldo insuficiente em '+loc); return; }
  exec(()=>ins('movimentos',{tipo:sg>0?'ajuste_entrada':'ajuste_saida',item_id:id,quantidade:qt,local_origem_id:sg<0?idLocal(loc):null,local_destino_id:sg>0?idLocal(loc):null,motivo:mot,feito_por:USR.id}),'Saldo ajustado').then(()=>fichaItem(id)); }
function confTransfItem(id){ const de=$('f_de').value, para=$('f_para').value, qt=parseInt($('f_q').value||'0',10); if(de===para||!(qt>0)) return; if(saldoItem(id,de)<qt){ toast('Saldo insuficiente em '+de); return; }
  exec(()=>ins('movimentos',{tipo:'transferencia',item_id:id,quantidade:qt,local_origem_id:idLocal(de),local_destino_id:idLocal(para),feito_por:USR.id}),'Transferido').then(()=>fichaItem(id)); }
async function exportar(){ const p={app:'verus_carrinhos',versao:2,exportado_em:new Date().toISOString(),empresa_id:EMP_ID,dados:C};
  const nome='verus_carrinhos_backup_'+hoje()+'.json', blob=new Blob([JSON.stringify(p,null,2)],{type:'application/json'});
  const dl=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null;
  if(dl){ try{ await dl.save({filename:nome,data:blob}); toast('Backup pronto'); }catch(e){ toast(e&&e.code==='declined'?'Download cancelado':'Não foi possível baixar'); } }
  else { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nome; document.body.appendChild(a); a.click(); a.remove(); toast('Backup gerado'); } }
function importar(input){ input.value=''; toast('Com o banco ligado, os dados ficam no Supabase: a importação do navegador não é mais usada'); }

// ───────── login e início ─────────
function telaLogin(msg){ document.body.insertAdjacentHTML('beforeend',`<div id="login" style="position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;padding:20px">
  <form onsubmit="entrar(event)" class="card" style="width:min(380px,100%);padding:24px"><div style="font-weight:800;letter-spacing:.06em;font-size:20px">VERUS <span style="font-weight:400;color:var(--muted)">Carrinhos</span></div><p class="sub" style="margin:4px 0 16px">Entre com o seu usuário.</p>
  <div class="campo" style="margin-bottom:10px"><label for="lgEmail">E-mail</label><input id="lgEmail" type="email" autocomplete="username" required></div>
  <div class="campo" style="margin-bottom:14px"><label for="lgSenha">Senha</label><input id="lgSenha" type="password" autocomplete="current-password" required></div>
  <div id="lgErr" style="color:var(--red);font-size:13px;min-height:18px;margin-bottom:8px">${esc(msg||'')}</div><button class="btn btn-p" style="width:100%;padding:10px" id="lgBtn">Entrar</button></form></div>`); }
async function entrar(ev){ ev.preventDefault(); const b=$('lgBtn'); b.disabled=true; b.textContent='Entrando…';
  const {error}=await sb.auth.signInWithPassword({email:$('lgEmail').value.trim(),password:$('lgSenha').value});
  if(error){ $('lgErr').textContent='E-mail ou senha inválidos'; b.disabled=false; b.textContent='Entrar'; return; }
  iniciar(); }
async function sair(){ await sb.auth.signOut(); location.reload(); }
async function iniciar(){
  const {data:{session}}=await sb.auth.getSession(); if(!session){ if(!$('login')) telaLogin(); return; }
  USR=session.user; const u=await q(sb.from('usuarios').select('empresa_id,nome,papel').eq('user_id',USR.id).eq('ativo',true).limit(1)).catch(()=>[]);
  if(!u||!u.length){ await sb.auth.signOut(); const l=$('login'); if(l) l.remove(); telaLogin('Seu usuário não está liberado em nenhuma empresa.'); return; }
  EMP_ID=u[0].empresa_id; USR.nome=u[0].nome; USR.papel=u[0].papel;
  $('conteudo').innerHTML='<div class="vazio">Carregando os dados…</div>';
  try{ await carregar(); }catch(e){ $('conteudo').innerHTML='<div class="vazio">Não consegui carregar os dados: '+esc(e.message||e)+'</div>'; return; }
  const l=$('login'); if(l) l.remove();
  if(!document.getElementById('btnSair')) document.querySelector('.rail .esp').insertAdjacentHTML('afterend',`<button type="button" id="btnSair" onclick="sair()" aria-label="Sair"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg><span class="lbl">Sair · ${esc((USR.nome||USR.email).split(' ')[0])}</span></button>`);
  render();
}

function telaHome(){ const h=new Date().getHours(), s=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
  return `<div style="max-width:760px;padding:40px 4px"><h1 style="font-size:26px">${s}${USR&&USR.nome?', '+esc(USR.nome.split(' ')[0]):''}.</h1>
    <p class="sub" style="font-size:15px">${esc((C.empresa&&C.empresa.razao_social)||'VERUS Carrinhos')} · ${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}</p>
    <div class="card" style="margin-top:22px;padding:22px;border-style:dashed;color:var(--muted)">Os indicadores da gestão entram aqui: vendas, estoque, financeiro, entregas e garantias.<br>Use o menu à esquerda para abrir os módulos.</div></div>`; }
const TELAS={ home:telaHome, itens:()=>telaCad('itens'), modelos:telaModelos, clientes:()=>telaCad('clientes'), fornecedores:()=>telaCad('fornecedores'), transportadores:()=>telaCad('transportadores'), vendedores:()=>telaCad('vendedores'), locais:telaLocais, empresa:telaEmpresa,
  estoque:telaEstoque, recebimento:telaRecebimento, movimentos:telaMovimentos };
iniciar();
